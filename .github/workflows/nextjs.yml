# WASLI OS requires a Node.js server. GitHub Pages static export is unsupported.
# This workflow validates the application; hosting prerequisites: docs/DEPLOYMENT.md.
name: WASLI OS validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          WASLI_PLAYWRIGHT_BUNDLED: 'true'
